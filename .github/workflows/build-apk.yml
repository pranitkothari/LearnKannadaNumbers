name: Build debug APK

on:
  push:
    branches:
      - claude/kannada-number-pronunciation-app-yleyb0
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # This CI runner has normal internet access, unlike the sandboxed dev
      # environment this app was built in - so it can fetch what that
      # environment couldn't reach (huggingface.co).
      - name: Download Whisper-tiny (multilingual) model
        run: |
          set -e
          DEST=app/src/main/assets/sherpa-onnx-whisper-tiny
          rm -f "$DEST/README.md"
          BASE=https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main
          curl -fL -o "$DEST/tiny-encoder.int8.onnx" "$BASE/tiny-encoder.int8.onnx"
          curl -fL -o "$DEST/tiny-decoder.int8.onnx" "$BASE/tiny-decoder.int8.onnx"
          curl -fL -o "$DEST/tiny-tokens.txt" "$BASE/tiny-tokens.txt"
          ls -la "$DEST"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kannada-numbers-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish/update release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          body: "Automatically built from ${{ github.sha }}. Debug build - not signed for release."
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
