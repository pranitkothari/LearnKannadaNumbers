name: Build APKs

on:
  push:
    branches:
      - claude/kannada-number-pronunciation-app-yleyb0
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # This CI runner has normal internet access, unlike the sandboxed dev
      # environment this app was built in - so it can fetch what that
      # environment couldn't reach (huggingface.co).
      - name: Download Whisper-tiny (multilingual) model
        run: |
          set -e
          DEST=app/src/main/assets/sherpa-onnx-whisper-tiny
          rm -f "$DEST/README.md"
          BASE=https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main
          curl -fL -o "$DEST/tiny-encoder.int8.onnx" "$BASE/tiny-encoder.int8.onnx"
          curl -fL -o "$DEST/tiny-decoder.int8.onnx" "$BASE/tiny-decoder.int8.onnx"
          curl -fL -o "$DEST/tiny-tokens.txt" "$BASE/tiny-tokens.txt"
          ls -la "$DEST"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Release is minified/shrunk (R8) and much faster to run than debug -
      # debug-signed though, so it installs without a real signing key.
      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Locate APKs
        id: apk
        run: |
          debug=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          release=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kannada-numbers-apks
          path: |
            ${{ steps.apk.outputs.debug }}
            ${{ steps.apk.outputs.release }}

      - name: Publish/update release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest build
          body: |
            Automatically built from ${{ github.sha }}.

            - **app-release.apk** - recommended; minified/optimized, much faster than debug
            - **app-debug.apk** - unoptimized, only useful for debugging

            Both are debug-signed (not suitable for Play Store), so both install fine when sideloaded.
          prerelease: true
          files: |
            ${{ steps.apk.outputs.debug }}
            ${{ steps.apk.outputs.release }}
